# Apex Reality — Default pipeline parameters
# All stages reference these defaults; GUI sliders override at runtime.

# Stage 1: Image Import & QC
import_qc:
  supported_extensions: [".jpg", ".jpeg", ".png", ".tif", ".tiff"]
  sharpness_threshold: 200.0     # Tile-based 90th percentile below this = blurry
  thumbnail_size: 256            # Gallery thumbnail longest edge

# Stage 2: Feature Extraction
extraction:
  extractor: "aliked"            # superpoint | disk | aliked
  max_keypoints: 8192            # balanced density for resize_max=1600
  nms_radius: 3                  # matches SuperPoint paper default; less aggressive
  resize_max: 1600               # COLMAP thresholds calibrated for ~1080p; 1600 is optimal
  as_half: false                 # false = float32 descriptors for max quality
  keypoint_threshold: 0.001      # low threshold to maximize candidate pool before top-k

# Stage 3: Feature Matching
matching:
  matcher: "lightglue"           # lightglue
  strategy: "exhaustive"         # exhaustive | retrieval
  depth_confidence: -1           # -1 = disable adaptive (max quality)
  width_confidence: -1           # -1 = disable adaptive (max quality)
  filter_threshold: 0.1          # match confidence threshold
  retrieval_top_k: 20            # pairs per image when using retrieval
  retrieval_model: "netvlad"     # retrieval model for pair generation
  # RoMa v2 rescue (optional dense re-matching of weak pairs)
  rescue_min_matches: 100        # pairs below this match count get re-matched
  rescue_snap_radius: 8.0        # px (original res) to snap dense matches to ALIKED keypoints

# Stages 4-5: Reconstruction
reconstruction:
  camera_model: "OPENCV"         # OPENCV | SIMPLE_RADIAL | PINHOLE | RADIAL
  single_camera: true            # all images share one camera model
  min_num_matches: 15            # minimum matches to consider a pair
  ba_local_max_num_iterations: 40
  ba_global_max_num_iterations: 100  # doubled for convergence on harder cases
  refine_focal_length: true
  refine_principal_point: true
  refine_extra_params: true

# Stage 6: Final Bundle Adjustment
refinement:
  ba_iterations: 200             # higher for final quality pass
  refine_focal_length: true
  refine_principal_point: true
  refine_extra_params: true

# Stage 7: Export
export:
  format: "binary"               # binary | text | both

# Stage 8: Object Masking
masking:
  birefnet_variant: "general"  # general | high-detail (DIS) | high-res SOD | massive | matting | HR matting (2048)
  threshold: 0.5               # confidence threshold [0-1]: lower = more inclusive, higher = tighter around object
  erosion_px: 0                # edge erosion in pixels (0 = none, 3-5 removes surface fringe)
  sam2_checkpoint: "sam2.1_hiera_large"

# Stage 9: 3DGS Training
training:
  backend: "gsplat"              # gsplat | (future: faster-gs)
  max_steps: 30000               # 30K = good quality, 60K = high quality
  data_factor: 2                 # final training resolution: 1/2/4/8 (2 → 3000x2000 from 6000x4000)
  test_every: 8                  # hold out every Nth image for evaluation
  sh_degree: 3                   # max spherical harmonics degree
  ssim_lambda: 0.2               # loss weight: (1-lambda)*L1 + lambda*SSIM
  init_type: "sfm"               # initialize from COLMAP points
  normalize_world_space: true    # normalize scene to unit cube
  random_bkgd: false             # auto-enabled when masks are present
  save_ply: true                 # export .ply point cloud at save steps
  # June 2026 quality stack
  strategy: "mcmc"               # mcmc (better quality + explicit budget) | default
  cap_max: 1000000               # MCMC Gaussian budget (~1M objects, ~3M scenes on 24GB)
  opacity_reg: 0.01              # opacity regularization (required for MCMC)
  scale_reg: 0.01                # scale regularization (required for MCMC)
  antialiased: true              # Mip-Splatting anti-aliasing
  pose_opt: true                 # SE(3) camera pose refinement during training
  pose_opt_lr: 0.00001
  coarse_factor: 4               # densification-phase resolution (2x data_factor)
  coarse_until: 15000            # step to switch from coarse to fine resolution

# Stage 10: Enhancement
enhancement:
  backend: "fixer"               # fixer (= NVIDIA NuRec Fixer, Cosmos 0.6B)
  num_views: 100                 # number of novel views to render & enhance
  timestep: 250                  # Fixer denoising timestep (250 recommended)
  # Distill-back loop (Difix3D+-style progressive update)
  distill_rounds: 2              # render->enhance->resume cycles
  distill_views_per_round: 80    # pseudo-views interpolated between cameras
  distill_steps_per_round: 4000  # resume-training steps per round (no densification)

# Alignment (applied during export)
alignment:
  enabled: true
  up_axis: "y"            # "y" for 3DGS/NeRF viewers, "z" for CAD/GIS
  center: true            # translate camera centroid to origin
  use_imu: true           # prefer IMU gravity data when available
